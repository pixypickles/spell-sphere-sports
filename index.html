<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#17233a"><title>魔導球技 Beginner Prototype v2</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="rotateNotice">スマホを横向きにしてください</div>
<main id="gameWrap">
 <canvas id="game" width="1280" height="720"></canvas>
 <div id="hud"><span id="roundLabel">ROUND 1</span><b id="score">0 - 0</b><span id="clock">1:00</span></div>
 <div id="manaHud"><small>MANA</small><div class="mana"><i id="manaFill"></i></div></div>
 <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
 <div id="buttons">
   <button id="special1" class="gameBtn sp s1">Ⅰ<small>✌</small></button>
   <button id="throwBtn" class="gameBtn throw">投<small>短/長押し</small></button>
   <button id="dodgeBtn" class="gameBtn dodge">↻<small>回避</small></button>
   <button id="special2" class="gameBtn sp s2">Ⅱ<small>✌</small></button>
 </div>
 <div id="message"></div>
 <div id="menu" class="overlay"><section class="panel"><div class="kicker">BEGINNER CUP / TEST MATCH</div><h1>魔導球技</h1><p>味方の役割を選択</p><label>味方A<select id="roleA"><option value="support">サポート</option><option value="attacker">旗取り</option><option value="guard">守備</option><option value="shooter">射撃</option><option value="balance">バランス</option></select></label><label>味方B<select id="roleB"><option value="guard">守備</option><option value="attacker">旗取り</option><option value="support">サポート</option><option value="shooter">射撃</option><option value="balance">バランス</option></select></label><button id="startBtn" class="menuBtn">試合開始</button><p class="note">青は左から右へ攻めます。敵旗に触れるか、敵3人を全員アウトで1本。2本先取。</p></section></div>
 <div id="result" class="overlay hidden"><section class="panel"><div class="kicker">RESULT</div><h1 id="resultTitle">ROUND WIN</h1><p id="resultText"></p><button id="nextBtn" class="menuBtn">次のラウンド</button></section></div>
</main><script src="game.js"></script></body></html>
