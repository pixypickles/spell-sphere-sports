<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#27314d" />
  <title>魔導球技 - Beginner Cup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">MAGIC BALL CUP</div>
      <div class="round-info"><span id="scoreBlue">0</span> - <span id="scoreRed">0</span></div>
      <div class="timer" id="timer">60</div>
    </header>

    <main class="game-wrap">
      <canvas id="game" width="1280" height="720" aria-label="game canvas"></canvas>

      <div class="left-ui">
        <div id="stick" class="stick">
          <div id="knob" class="knob"></div>
        </div>
      </div>

      <div class="right-ui">
        <button id="special1" class="btn special">Ⅰ<span>✌️</span></button>
        <button id="throwBtn" class="btn throw">投<span>短押し / 長押し</span></button>
        <button id="dodgeBtn" class="btn dodge">↻<span>回避</span></button>
        <button id="special2" class="btn special">Ⅱ<span>✌️</span></button>
      </div>

      <div class="hud">
        <div class="mana-wrap">
          <div class="mana-label">MANA</div>
          <div class="mana-bar"><div id="manaFill"></div></div>
        </div>
        <div id="message" class="message">BEGINNER CUP</div>
      </div>

      <div id="rolePanel" class="overlay">
        <div class="panel">
          <h1>BEGINNER CUP</h1>
          <p>味方2人の役割を選んで試合開始</p>

          <label>味方 A
            <select id="ally1Role">
              <option value="support">サポート</option>
              <option value="attacker">旗取り</option>
              <option value="guard">守備</option>
              <option value="shooter">射撃</option>
              <option value="balance">バランス</option>
            </select>
          </label>

          <label>味方 B
            <select id="ally2Role">
              <option value="guard">守備</option>
              <option value="attacker">旗取り</option>
              <option value="support">サポート</option>
              <option value="shooter">射撃</option>
              <option value="balance">バランス</option>
            </select>
          </label>

          <button id="startBtn" class="start">試合開始</button>
          <p class="small">勝利条件：敵全員アウト または 敵旗に触れる / 2本先取</p>
        </div>
      </div>

      <div id="resultPanel" class="overlay hidden">
        <div class="panel">
          <h1 id="resultTitle">WIN!</h1>
          <p id="resultText"></p>
          <button id="nextBtn" class="start">次へ</button>
        </div>
      </div>
    </main>
  </div>
  <script src="game.js"></script>
</body>
</html>
